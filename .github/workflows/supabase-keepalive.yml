# Pings the Supabase project daily so the free tier never pauses it.
# Supabase pauses free projects after 7 idle days and deletes long-paused ones;
# one lightweight REST call a day counts as activity.
name: Supabase keepalive
on:
  schedule:
    - cron: "17 11 * * *"   # daily, 11:17 UTC
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping reactions view
        run: |
          curl -sS -f -o /dev/null -w "HTTP %{http_code}\n" \
            -H "apikey: sb_publishable_jT_Y06Uh2vznDHQFfzhc7w_VLPqQKdf" \
            -H "Authorization: Bearer sb_publishable_jT_Y06Uh2vznDHQFfzhc7w_VLPqQKdf" \
            "https://xsftjjrbivparsfxobmz.supabase.co/rest/v1/v_reaction_counts?select=*&limit=1"
